<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1324" />
    <title>Code Siege</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/siege/siege.css" />
  </head>
  <body class="siege">
    <div id="app">
      <header class="hud" id="hud" hidden>
        <div class="hud-who"><span id="hud-name"></span><span class="hud-sub"><span id="hud-hq"></span><span class="chips" id="hud-chips"></span></span></div>
        <div class="hud-stat"><span class="coin"></span><span id="hud-coins">0</span><span class="delta" id="hud-delta"></span></div>
        <div class="hud-stat" title="Trophies"><span class="trophy">&#9819;</span><span id="hud-trophies">0</span></div>
        <button class="icon-btn" id="sound-btn" aria-label="Sound on">&#128266;</button>
        <button class="icon-btn" id="menu-btn" aria-label="Menu">&#9776;</button>
      </header>
      <div class="banner-row" id="banner-row" hidden>
        <button class="wave-banner" id="wave-banner"></button>
        <div class="mode-toggle" id="mode-toggle" role="group" aria-label="Mode">
          <button data-mode="pve" aria-pressed="true">&#9935; Grind</button>
          <button data-mode="pvp" aria-pressed="false">&#9876; Raid</button>
          <span class="mode-cd" id="mode-cd"></span>
        </div>
      </div>
      <main class="stage">
        <div class="board-wrap" id="board-wrap">
          <canvas id="board"></canvas>
          <div class="vignette" aria-hidden="true"></div>
          <div class="hurt" id="hurt" aria-hidden="true"></div>
          <canvas class="minimap" id="minimap" width="180" height="180" aria-label="Map"></canvas>
          <div class="map-tools" id="map-tools" hidden>
            <button class="tool" id="home-btn">My base</button>
            <button class="tool" id="ranks-btn">Ranks</button>
            <button class="tool" id="live-btn">Live <span class="badge" id="live-count" hidden>0</span></button>
            <button class="tool crate-tool" id="crate-btn">Crate <span class="badge" id="crate-badge" hidden>!</span></button>
          </div>
          <div class="zoom-tools">
            <button class="tool sq" id="zoom-in" aria-label="Zoom in">+</button>
            <button class="tool sq" id="zoom-out" aria-label="Zoom out">&minus;</button>
          </div>
          <div class="feed" id="feed"></div>
          <div class="coach" id="coach" hidden></div>
          <div class="cmd-bar" id="cmd-bar" hidden>
            <div class="combo" id="combo" hidden></div>
            <button class="early" id="early-btn" hidden><b>&#9193; Call early</b><small id="early-sub"></small></button>
            <button class="ammo" id="ammo" aria-label="Reload (R)"><span class="ammo-name" id="ammo-name">Pistol</span><span class="rounds" id="rounds"></span><span class="reload-fill" id="reload-fill"></span></button>
            <button class="strike" id="strike-btn" aria-label="Airstrike (Q)"><span class="strike-icon">&#9992;</span><span class="strike-cd" id="strike-cd"></span></button>
          </div>
          <div class="attack-bar" id="attack-bar" hidden>
            <div class="attack-top">
              <span id="raid-title"></span>
              <span class="raid-stars" id="raid-stars" aria-label="Stars">☆☆☆</span>
              <span class="raid-stat"><b id="raid-dmg">0%</b> destroyed</span>
              <span class="raid-stat"><b id="raid-army">40</b> raiders left</span>
              <button class="tool danger" id="retreat-btn">End attack</button>
            </div>
            <div class="troops" id="troops"></div>
            <p class="attack-hint">Tap the red ground outside their walls to send a raider. ★ 50% destroyed · ★ Main Tower · ★ everything. Crack the vault for more loot.</p>
          </div>
        </div>
        <aside class="panel" id="panel" hidden></aside>
      </main>
      <div class="toasts" id="toasts"></div>
      <div class="menu" id="menu" hidden>
        <button id="logout-btn">Log out</button>
        <button id="close-menu">Close</button>
      </div>
      <section class="title" id="title" hidden aria-label="Code Siege title screen">
        <canvas id="title-canvas" aria-hidden="true"></canvas>
        <div class="title-crt" aria-hidden="true"></div>
        <input id="title-name" class="title-input" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Your name" hidden />
        <input id="title-roll" class="title-input" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Roll number" hidden />
        <nav class="sr-only" aria-label="Main menu">
          <button data-title-item="0">Start game</button>
          <button data-title-item="1">How to play</button>
          <button data-title-item="2">Leaderboard</button>
          <button data-title-item="3">Live Arena</button>
        </nav>
        <p class="sr-only" id="title-live" aria-live="polite"></p>
      </section>
      <div class="connecting" id="connecting">Connecting...</div>
    </div>
    <footer class="credit">Art: <a href="https://thelazystone.itch.io/post-apocalyptic-pixel-art-asset-pack" target="_blank" rel="noopener">Post-Apocalypse asset pack by TheLazyStone</a> · IETE-SF MPSTME</footer>
    <script type="module" src="/src/siege/main.ts"></script>
  </body>
</html>
